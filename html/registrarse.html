<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KEEPER | Regístrate</title>
    <link rel="stylesheet" href="../css/comun.css">
    <link rel="stylesheet" href="../css/registrarse.css">
    <link rel="stylesheet" href="../css/animaciones.css">
    <link rel="stylesheet" href="../css/tema-claro.css">
    <link rel="icon" href="../img/logo-Global.png">
</head>
<body>
    <!-- Conmutador de Modo Fijo -->
    <div class="conmutador-modo">
        <button class="boton-conmutador" id="btn-oscuro" aria-label="Modo oscuro">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.5"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" fill="currentColor"/></svg>
        </button>
        <button class="boton-conmutador" id="btn-claro" aria-label="Modo claro">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5" fill="currentColor"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        </button>
    </div>

    <!-- Logo Superior KEEPER Fijo -->
    <header class="superior-logo">
        <img src="../img/logo-blanco.png" alt="Logo" class="logo">
        <span>keeper</span>
    </header>

    <!-- Fondo de Cuadrícula Cyber -->
    <div class="bg-cuadricula" aria-hidden="true"></div>

    <!-- Gran Tarjeta Split-Screen Flotante -->
    <div class="tarjeta-auth-split ancho-registro">
        <!-- Columna Izquierda: Formulario de Registro -->
        <div class="auth-panel-formulario">
            <form class="formulario-registro" id="formulario-registro" autocomplete="off">
                <div class="card-encabezado">
                    <div class="card-encabezado-resplandor" aria-hidden="true"></div>
                    <img src="../img/logo-blanco.png" alt="Keeper" class="logotipo-registro">
                    <h2 class="titulo-registro">Crea el administrador</h2>
                    <p class="subtitulo-registro">Primera configuración: esta será la cuenta principal para administrar tu residencial</p>
                </div>

                <div class="seccion-formulario">
                    <div class="etiqueta-seccion">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        <span>Acceso</span>
                    </div>

                    <div class="fila-formulario">
                        <div class="envoltura-icono-entrada">
                            <span class="icono-principal-entrada" aria-hidden="true">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                            </span>
                            <input class="control-formulario" type="email" id="entrada-correo" name="email" placeholder="Correo electrónico" maxlength="100" required>
                        </div>
                    </div>

                    <div class="grid-dos-columnas">
                        <div class="fila-formulario">
                            <div class="envoltura-icono-entrada">
                                <span class="icono-principal-entrada" aria-hidden="true">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                                </span>
                                <input class="control-formulario" type="password" id="entrada-contrasena" name="password" placeholder="Contraseña (mín. 8)" minlength="8" maxlength="100" required>
                                <button type="button" class="icono-boton" id="alternar-contrasena-btn" aria-label="Mostrar contraseña" data-target="entrada-contrasena">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8892a8" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                                </button>
                            </div>
                        </div>

                        <div class="fila-formulario">
                            <div class="envoltura-icono-entrada">
                                <span class="icono-principal-entrada" aria-hidden="true">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                                </span>
                                <input class="control-formulario" type="password" id="confirmar-contrasena-entrada" name="confirmPassword" placeholder="Confirmar contraseña" minlength="8" maxlength="100" required>
                                <button type="button" class="icono-boton" id="alternar-confirmar-contrasena-btn" aria-label="Mostrar contraseña" data-target="confirmar-contrasena-entrada">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8892a8" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="seccion-formulario">
                    <div class="etiqueta-seccion">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                        <span>Información personal</span>
                    </div>

                    <div class="grid-dos-columnas">
                        <div class="fila-formulario">
                            <div class="envoltura-icono-entrada">
                                <span class="icono-principal-entrada" aria-hidden="true">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                                </span>
                                <input class="control-formulario" type="text" id="nombre-entrada" name="firstName" placeholder="Nombre" maxlength="50" required>
                            </div>
                        </div>
                        <div class="fila-formulario">
                            <div class="envoltura-icono-entrada">
                                <span class="icono-principal-entrada" aria-hidden="true">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                                </span>
                                <input class="control-formulario" type="text" id="apellido-entrada" name="lastName" placeholder="Apellido" maxlength="50" required>
                            </div>
                        </div>
                    </div>

                    <div class="grid-dos-columnas">
                        <div class="fila-formulario">
                            <div class="envoltura-icono-entrada">
                                <span class="icono-principal-entrada" aria-hidden="true">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
                                </span>
                                <input class="control-formulario" type="text" id="dui-entrada" name="dui" placeholder="DUI (00000000-0)" maxlength="10" pattern="^[0-9]{8}-[0-9]$" title="Formato DUI: 00000000-0" required>
                            </div>
                        </div>
                        <div class="fila-formulario">
                            <div class="envoltura-icono-entrada">
                                <span class="icono-principal-entrada" aria-hidden="true">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
                                </span>
                                <input class="control-formulario" type="tel" id="telefono-entrada" name="phone" placeholder="Teléfono (0000-0000)" maxlength="9" pattern="^[0-9]{4}-[0-9]{4}$" title="Formato teléfono: 0000-0000" required>
                            </div>
                        </div>
                    </div>

                    <div class="grid-dos-columnas">
                        <div class="fila-formulario">
                            <div class="envoltura-icono-entrada">
                                <span class="icono-principal-entrada" aria-hidden="true">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                                </span>
                                <input class="control-formulario" type="text" id="fecha-nacimiento-entrada" name="birthdate" placeholder="Fecha nacimiento" data-fecha readonly required>
                            </div>
                        </div>

                        <div class="envoltura-foto-avatar">
                            <label for="foto-entrada" class="foto-avatar" id="foto-vista-previa" title="Haz clic para subir foto">
                                <img src="../img/logo-Global.png" alt="Vista previa foto de perfil" id="foto-vista-previa-img" class="foto-preview">
                                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2473F5" stroke-width="1.8"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
                                <span>Subir foto</span>
                            </label>
                            <input type="file" id="foto-entrada" name="photo" accept="image/png, image/jpeg, image/jpg, image/webp" hidden>
                        </div>
                    </div>

                    <button class="boton-enviar" type="submit" id="registrar-enviar-btn">
                        <span class="texto-boton-enviar">Crear cuenta</span>
                        <svg class="flecha-boton-enviar" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
                    </button>

                    <div class="divisor-formulario">
                        <span>o</span>
                    </div>

                    <div class="opciones-formulario">
                        <a href="../Index.html">¿Ya tienes cuenta? <strong>Inicia sesión</strong></a>
                    </div>
                </div>
            </form>
        </div>

        <!-- Columna Derecha: Showcase Ilustrado -->
        <div class="auth-panel-showcase">
            <div class="auth-showcase-contenido">
                <img src="../img/ilustracion claro.svg" alt="Keeper Ilustración" class="auth-ilustracion ilustracion-claro">
                <img src="../img/ilustracion oscuro.svg" alt="Keeper Ilustración" class="auth-ilustracion ilustracion-oscuro">
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../js/Recursos/animaciones.js"></script><script src="../js/Recursos/validaciones.js?v=2"></script>
    <script src="../js/Recursos/comun.js"></script>
    <script src="../js/servicios/api-config.js"></script>
    <script src="../js/controladores/registrarse.js"></script>
</body>
</html>
